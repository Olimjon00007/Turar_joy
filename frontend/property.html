<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kvartira Tafsilotlari - EleganceEstate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">EleganceEstate</a>
        <nav class="nav-links">
            <a href="index.html">Bosh sahifa</a>
            <a href="sotib-olish.html">Sotib olish</a>
            <a href="ijaraga-olish.html">Ijaraga olish</a>
            <a href="biz-haqimizda.html">Biz haqimizda</a>
            <a href="aloqa.html">Aloqa</a>
            <a href="yuklash.html" class="nav-btn"><i class="fas fa-plus"></i> E'lon berish</a>
        </nav>
    </header>

    <section class="detail-hero" id="detailHero">
        <div class="detail-header">
            <h1 id="detailTitle">Yuklanmoqda...</h1>
            <div class="location">
                <i class="fas fa-map-marker-alt"></i> <span id="detailLocation">Manzil yuklanmoqda...</span>
            </div>
        </div>
    </section>

    <div class="detail-content">
        <div class="main-info">
            <h3>Kvartira haqida</h3>
            <p id="detailDescription">Tavsif yuklanmoqda...</p>

            <h3 class="section-title-spacing">Xususiyatlar</h3>
            <div class="features">
                <span class="feature-tag"><i class="fas fa-bed"></i> <span id="detailRooms">0</span> xona</span>
                <span class="feature-tag"><i class="fas fa-vector-square"></i> <span id="detailArea">0</span> m²</span>
                <span class="feature-tag"><i class="fas fa-layer-group"></i> <span id="detailFloor">Noma'lum</span></span>
                <span class="feature-tag"><i class="fas fa-shield-alt"></i> 24/7 Qo'riqlash</span>
                <span class="feature-tag"><i class="fas fa-wifi"></i> Internet</span>
            </div>
        </div>

        <div class="sidebar">
            <div class="action-card">
                <div class="price" id="detailPrice">$0</div>
                <div class="property-meta" id="detailMeta">
                    <!-- Dynamic meta info -->
                </div>
                
                <a href="#" class="btn">Sotib olish uchun ariza</a>
                <a href="#" class="btn btn-outline" id="contactTelegram"><i class="fab fa-telegram"></i> Telegram orqali bog'lanish</a>
                <a href="tel:+998901234567" class="btn btn-outline"><i class="fas fa-phone"></i> +998 90 123 45 67</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const propertyId = params.get('id');
            const estates = JSON.parse(localStorage.getItem('estates') || '[]');
            
            const property = estates.find(e => e.id === propertyId);

            if (!property) {
                document.querySelector('.detail-content').innerHTML = '<div class="no-results">E\'lon topilmadi yoki o\'chirib tashlangan.</div>';
                return;
            }

            // Update UI
            document.getElementById('detailTitle').textContent = property.title;
            document.getElementById('detailLocation').textContent = `${property.region}, ${property.district}, ${property.neighborhood || ''}`;
            document.getElementById('detailDescription').textContent = property.description || 'Tavsif berilmagan.';
            document.getElementById('detailPrice').textContent = `$${property.price}${property.type === 'ijara' ? ' / oy' : ''}`;
            document.getElementById('detailRooms').textContent = property.rooms;
            document.getElementById('detailArea').textContent = property.area;
            document.getElementById('detailFloor').textContent = property.floor || 'Qavat noma\'lum';
            
            if (property.mainImage) {
                document.getElementById('detailHero').style.backgroundImage = `url(${property.mainImage})`;
            }

            // Telegram link (optional enhancement)
            document.getElementById('contactTelegram').href = `https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent('Ushbu e\'lon bo\'yicha bog\'lanmoqchiman: ' + property.title)}`;
        });
    </script>

</body>
</html>
