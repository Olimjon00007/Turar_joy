<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E'lon berish - EleganceEstate</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="yuklash.css">
</head>
<body>

    <header class="yuklash-header">
        <a href="index.html" class="logo">EleganceEstate</a>
        <nav class="nav-links">
            <a href="index.html">Bosh sahifa</a>
            <a href="sotib-olish.html">Sotib olish</a>
            <a href="ijaraga-olish.html">Ijaraga olish</a>
            <a href="biz-haqimizda.html">Biz haqimizda</a>
            <a href="aloqa.html">Aloqa</a>
            <a href="yuklash.html" class="nav-btn"><i class="fas fa-plus"></i> E'lon berish</a>
        </nav>
    </header>

    <section class="upload-section">
        <div class="upload-card">
            <h1>Yangi kvartira qo'shish</h1>
            
            <form id="uploadForm">
                
                <!-- 1. E'lon turi -->
                <div class="form-section">
                    <h3><i class="fas fa-bullhorn"></i> E'lon turi</h3>
                    <div class="type-selector">
                        <label class="type-option">
                            <input type="radio" name="listingType" value="sotish" checked>
                            <span class="type-card">
                                <i class="fas fa-home"></i>
                                Sotish
                            </span>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="listingType" value="ijara">
                            <span class="type-card">
                                <i class="fas fa-key"></i>
                                Ijaraga berish
                            </span>
                        </label>
                    </div>
                </div>

                <!-- 2. Asosiy ma'lumotlar -->
                <div class="form-section">
                    <h3><i class="fas fa-info-circle"></i> Asosiy ma'lumotlar</h3>
                    <div class="form-group">
                        <label>Sarlavha (Qisqa va tushunarli)</label>
                        <input type="text" id="title" class="form-control" placeholder="Masalan: Qorasaroyda 3 xonali evrota'mir kvartira" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Narxi ($)</label>
                            <input type="number" id="price" class="form-control" placeholder="Masalan: 150000" required>
                        </div>
                        <div class="form-group">
                            <label>Xonalar soni</label>
                            <input type="number" id="rooms" class="form-control" placeholder="3" required>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Maydoni (m²)</label>
                            <input type="number" id="area" class="form-control" placeholder="120" required>
                        </div>
                        <div class="form-group">
                            <label>Qavat</label>
                            <input type="text" id="floor" class="form-control" placeholder="Masalan: 4/9">
                        </div>
                    </div>
                </div>

                <!-- 3. Manzil (Cascading Selects) -->
                <div class="form-section">
                    <h3><i class="fas fa-map-marker-alt"></i> Manzil</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Viloyat</label>
                            <select id="regionSelect" class="form-control" required>
                                <option value="" disabled selected>Viloyatni tanlang</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tuman / Shahar</label>
                            <select id="districtSelect" class="form-control" disabled required>
                                <option value="" disabled selected>Avval viloyatni tanlang</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Mahalla / Punkt (Yozib qidiring)</label>
                            <input type="text" id="neighborhoodInput" class="form-control" list="mahallaList" placeholder="Masalan: Bodomzor">
                            <datalist id="mahallaList">
                                <!-- Dynamic mahallas will be loaded here based on district -->
                            </datalist>
                        </div>
                        <div class="form-group">
                            <label>Ko'cha / Uy raqami</label>
                            <input type="text" id="street" class="form-control" placeholder="Masalan: Navoiy ko'chasi, 12-uy">
                        </div>
                    </div>
                </div>

                <!-- 4. Rasmlar -->
                <div class="form-section">
                    <h3><i class="fas fa-images"></i> Rasmlar</h3>
                    <label class="file-upload">
                        <input type="file" id="imageInput" multiple accept="image/*">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Rasmlarni yuklash uchun bosing</p>
                    </label>
                    <div class="image-preview-container" id="imageContainer">
                        <!-- Images will appear here -->
                    </div>
                </div>

                <div class="form-group" style="margin-top: 25px;">
                    <label>Batafsil tavsif</label>
                    <textarea id="description" class="form-control" placeholder="Kvartira haqida batafsil yozing..." style="min-height: 150px;"></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i> E'lonni tizimga qo'shish
                </button>
            </form>
        </div>
    </section>

    <script>
        // --- 1. LOCATION DATA (MOCK) ---
        const locations = {
            "Toshkent shahri": ["Bektemir tumani", "Chilonzor tumani", "Mirobod tumani", "Mirzo Ulug'bek tumani", "Sergeli tumani", "Shayxontohur tumani", "Olmazor tumani", "Uchtepa tumani", "Yakkasaroy tumani", "Yashnobod tumani", "Yunusobod tumani", "Yangihayot tumani"],
            "Toshkent viloyati": ["Bekobod tumani", "Bo'ka tumani", "Bo'stonliq tumani", "Chinoz tumani", "Qibray tumani", "Ohangaron tumani", "Oqqo'rg'on tumani", "Parkent tumani", "Piskent tumani", "Quyi Chirchiq tumani", "O'rta Chirchiq tumani", "Yangiyo'l tumani", "Yuqori Chirchiq tumani", "Zangiota tumani", "Toshkent tumani", "Nurafshon shahri", "Olmaliq shahri", "Angren shahri", "Chirchiq shahri"],
            "Sirdaryo viloyati": ["Oqoltin tumani", "Boyovut tumani", "Guliston tumani", "Xovos tumani", "Mirzaobod tumani", "Sayxunobod tumani", "Sardoba tumani", "Sirdaryo tumani", "Yangiyer shahri", "Shirin shahri"],
            "Jizzax viloyati": ["Arnasoy tumani", "Baxmal tumani", "Do'stlik tumani", "Forish tumani", "G'allaorol tumani", "Sharof Rashidov tumani", "Mirzacho'l tumani", "Paxtakor tumani", "Yangiobod tumani", "Zomin tumani", "Zafarobod tumani", "Zarbdor tumani", "Jizzax shahri"],
            "Samarqand viloyati": ["Bulung'ur tumani", "Ishtixon tumani", "Jomboy tumani", "Kattaqo'rg'on tumani", "Qo'shrabot tumani", "Narpay tumani", "Nurobod tumani", "Oqdaryo tumani", "Paxtachi tumani", "Payariq tumani", "Pastdarg'om tumani", "Samarqand tumani", "Toyloq tumani", "Urgut tumani", "Samarqand shahri"],
            "Farg'ona viloyati": ["Oltiariq tumani", "Bag'dod tumani", "Beshariq tumani", "Buvayda tumani", "Dang'ara tumani", "Farg'ona tumani", "Furqat tumani", "Qo'shtepa tumani", "Quva tumani", "Rishton tumani", "So'x tumani", "Toshloq tumani", "Uchko'prik tumani", "O'zbekiston tumani", "Yozyovon tumani", "Farg'ona shahri", "Marg'ilon shahri", "Qo'qon shahri"],
            "Namangan viloyati": ["Chortoq tumani", "Chust tumani", "Kosonsoy tumani", "Mingbuloq tumani", "Namangan tumani", "Norin tumani", "Pop tumani", "To'raqo'rg'on tumani", "Uchqo'rg'on tumani", "Uychi tumani", "Yangiqo'rg'on tumani", "Namangan shahri"],
            "Andijon viloyati": ["Andijon tumani", "Asaka tumani", "Baliqchi tumani", "Bo'z tumani", "Buloqboshi tumani", "Izboskan tumani", "Jalaquduq tumani", "Marhamat tumani", "Oltinko'l tumani", "Paxtaobod tumani", "Qo'rg'ontepa tumani", "Shahrixon tumani", "Ulug'nor tumani", "Xo'jaobod tumani", "Andijon shahri"],
            "Qashqadaryo viloyati": ["Chiroqchi tumani", "Dehqonobod tumani", "G'uzor tumani", "Qamashi tumani", "Qarshi tumani", "Koson tumani", "Kasbi tumani", "Kitob tumani", "Mirishkor tumani", "Muborak tumani", "Nishon tumani", "Shahrisabz tumani", "Yakkabog' tumani", "Ko'kdala tumani", "Qarshi shahri"],
            "Surxondaryo viloyati": ["Angor tumani", "Boysun tumani", "Denov tumani", "Jarqo'rg'on tumani", "Qiziriq tumani", "Qumqo'rg'on tumani", "Muzrabot tumani", "Oltinsoy tumani", "Sariosiyo tumani", "Sherobod tumani", "Sho'rchi tumani", "Termiz tumani", "Uzun tumani", "Bandixon tumani", "Termiz shahri"],
            "Buxoro viloyati": ["Buxoro tumani", "G'ijduvon tumani", "Jondor tumani", "Kogon tumani", "Olot tumani", "Peshku tumani", "Qorako'l tumani", "Qorovulbozor tumani", "Romitan tumani", "Shofirkon tumani", "Vobkent tumani", "Buxoro shahri"],
            "Navoiy viloyati": ["Karmana tumani", "Konimex tumani", "Qiziltepa tumani", "Xatirchi tumani", "Navbahor tumani", "Nurota tumani", "Tomdi tumani", "Uchquduq tumani", "Navoiy shahri", "Zarafshon shahri"],
            "Xorazm viloyati": ["Bog'ot tumani", "Gurlan tumani", "Xonqa tumani", "Hazorasp tumani", "Xiva tumani", "Qo'shko'pir tumani", "Shovot tumani", "Urganch tumani", "Yangiariq tumani", "Yangibozor tumani", "Tuproqqal'a tumani", "Urganch shahri"],
            "Qoraqalpog'iston Respublikasi": ["Amudaryo tumani", "Beruniy tumani", "Chimboy tumani", "Ellikqal'a tumani", "Kegeyli tumani", "Mo'ynoq tumani", "Nukus tumani", "Qonliko'l tumani", "Qo'ng'irot tumani", "Qorao'zak tumani", "Shumanay tumani", "Taxtako'pir tumani", "To'rtko'l tumani", "Xo'jayli tumani", "Bo'zatov tumani", "Nukus shahri"]
        };

        const regionSelect = document.getElementById('regionSelect');
        const districtSelect = document.getElementById('districtSelect');
        const neighborhoodInput = document.getElementById('neighborhoodInput');

        // Populate Regions
        for (let region in locations) {
            let opt = document.createElement('option');
            opt.value = region;
            opt.textContent = region;
            regionSelect.appendChild(opt);
        }

        // On Region Change
        regionSelect.addEventListener('change', function() {
            districtSelect.innerHTML = '<option value="" disabled selected>Tumanni tanlang</option>';
            document.getElementById('mahallaList').innerHTML = '';
            document.getElementById('neighborhoodInput').value = '';
            
            const selectedRegion = this.value;
            if(selectedRegion) {
                const districts = locations[selectedRegion];
                districts.forEach(dist => {
                    let opt = document.createElement('option');
                    opt.value = dist;
                    opt.textContent = dist;
                    districtSelect.appendChild(opt);
                });
                districtSelect.disabled = false;
            } else {
                districtSelect.disabled = true;
            }
        });

        // On District Change - Populate Mahallas for Autocomplete
        const mockMahallas = {
            "Yunusobod tumani": ["Bodomzor MFY", "Minor MFY", "Shayx Shibliy MFY", "Yunusobod 1-kvartal", "Yunusobod 19-kvartal"],
            "Chilonzor tumani": ["Oqtepa MFY", "Qatortol MFY", "Chilonzor 1-kvartal", "Chilonzor 8-kvartal", "Katta Chilonzor MFY"],
            "Mirzo Ulug'bek tumani": ["Qorasuv MFY", "Darxon MFY", "TTZ-1", "TTZ-2", "Yalangach MFY", "Oqibat MFY"],
            "Samarqand shahri": ["Sug'diyona MFY", "Bog'ishamol MFY", "Mikrorayon", "Siyob MFY"],
            "Buxoro shahri": ["Eski shahar", "Sharq MFY", "Hofiz Tanish Buxoriy MFY"]
        };

        districtSelect.addEventListener('change', function() {
            const dataList = document.getElementById('mahallaList');
            dataList.innerHTML = '';
            document.getElementById('neighborhoodInput').value = '';
            
            const selectedDistrict = this.value;
            
            // In a real app, you would fetch the 10,000 mahallas from the backend here:
            // fetch(`/api/mahallas?district=${selectedDistrict}`).then(...)
            
            // For now, we use our mock data (or generate some dummy data if not in mock)
            let mahallas = mockMahallas[selectedDistrict];
            
            if (!mahallas) {
                // If we don't have mock data for this district, generate some generic ones
                mahallas = ["Markaziy MFY", "Navoiy MFY", "Do'stlik MFY", "Yoshlik MFY", "Mustaqillik MFY"];
            }

            mahallas.forEach(mahalla => {
                let opt = document.createElement('option');
                opt.value = mahalla;
                dataList.appendChild(opt);
            });
        });


        // --- 2. IMAGE UPLOAD & PREVIEW ---
        const imageInput = document.getElementById('imageInput');
        const imageContainer = document.getElementById('imageContainer');
        let uploadedImages = []; // store data urls
        let mainImageIndex = 0;

        imageInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            
            files.forEach(file => {
                compressImage(file, function(dataUrl) {
                    uploadedImages.push(dataUrl);
                    renderImages();
                });
            });
            this.value = '';
        });

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6)); // Compress to 60% quality JPEG
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderImages() {
            imageContainer.innerHTML = '';
            uploadedImages.forEach((imgSrc, index) => {
                const div = document.createElement('div');
                div.className = `image-preview ${index === mainImageIndex ? 'is-main' : ''}`;
                
                div.onclick = function() {
                    mainImageIndex = index;
                    renderImages();
                };

                const img = document.createElement('img');
                img.src = imgSrc;

                const removeBtn = document.createElement('div');
                removeBtn.className = 'remove-img';
                removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                removeBtn.onclick = function(e) {
                    e.stopPropagation(); // prevent clicking the parent
                    uploadedImages.splice(index, 1);
                    if(mainImageIndex === index) mainImageIndex = 0;
                    if(mainImageIndex >= uploadedImages.length) mainImageIndex = Math.max(0, uploadedImages.length - 1);
                    renderImages();
                };

                div.appendChild(img);
                div.appendChild(removeBtn);
                imageContainer.appendChild(div);
            });
        }


        // --- 3. FORM SUBMISSION (Mock Backend with LocalStorage) ---
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if(uploadedImages.length === 0) {
                alert("Kamida bitta rasm yuklashingiz kerak!");
                return;
            }

            const listingType = document.querySelector('input[name="listingType"]:checked').value;
            
            const newListing = {
                id: Date.now().toString(),
                type: listingType,
                title: document.getElementById('title').value,
                price: document.getElementById('price').value,
                rooms: document.getElementById('rooms').value,
                area: document.getElementById('area').value,
                region: regionSelect.value,
                district: districtSelect.value,
                neighborhood: document.getElementById('neighborhoodInput').value,
                street: document.getElementById('street').value,
                description: document.getElementById('description').value,
                mainImage: uploadedImages[mainImageIndex]
            };

            // Save to localStorage
            let existingListings = JSON.parse(localStorage.getItem('estates') || '[]');
            existingListings.unshift(newListing); // Add to beginning
            localStorage.setItem('estates', JSON.stringify(existingListings));

            alert("E'lon muvaffaqiyatli saqlandi!");
            
            // Redirect based on type
            if(listingType === 'sotish') {
                window.location.href = 'sotib-olish.html';
            } else {
                window.location.href = 'ijaraga-olish.html';
            }
        });
    </script>
</body>
</html>
