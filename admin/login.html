<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kvartira Admin</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle at center, #1e1d1a 0%, #0a0a0a 100%);
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Animated background elements */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(150px);
            opacity: 0.1;
            z-index: 0;
            border-radius: 50%;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 50px 40px;
            border-radius: 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            position: relative;
            z-index: 10;
        }

        .login-card h2 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #fff;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .login-card p {
            color: rgba(255,255,255,0.5);
            margin-bottom: 40px;
            font-size: 15px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 12px;
            color: #C5A059; /* Explicit Gold */
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 16px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .input-group input:focus {
            border-color: #C5A059;
            background: rgba(197, 160, 89, 0.05);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.1);
        }

        .login-btn {
            width: 100%;
            margin-top: 10px;
            padding: 16px !important;
            font-weight: 700 !important;
            letter-spacing: 2px;
            background: #C5A059 !important; /* Gold Button */
            color: #000 !important;
            border: none !important;
            border-radius: 16px !important;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: #e2bd76 !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(197, 160, 89, 0.3);
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            opacity: 0.7;
        }

        .back-home:hover {
            color: var(--primary);
            opacity: 1;
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div class="bg-glow" style="top: -100px; left: -100px;"></div>
    <div class="bg-glow" style="bottom: -100px; right: -100px;"></div>

    <div class="login-card">
        <h2>Tizimga kirish</h2>
        <p>Boshqaruv paneli va e'lonlar uchun</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>Foydalanuvchi nomi</label>
                <input type="text" id="username" placeholder="Masalan: owner" required>
            </div>
            <div class="input-group">
                <label>Maxfiy parol</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn login-btn">KIRISH</button>
        </form>

        <a href="/" class="back-home"><i class="fas fa-arrow-left"></i> Bosh sahifaga qaytish</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', data.role);
                    
                    // Check for redirect parameter
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectTo = urlParams.get('redirect');
                    
                    if (redirectTo) {
                        window.location.href = redirectTo;
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    alert(data.message || 'Login yoki parol xato!');
                }
            } catch (err) {
                console.error('Login xatosi:', err);
                alert('Serverga ulanishda xato yuz berdi!');
            }
        });
    </script>
</body>
</html>
